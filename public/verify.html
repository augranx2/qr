<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Verifikasi Tanda Tangan Elektronik</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f1f5f9; margin: 0; padding: 24px; color: #0f172a; }
  .card { max-width: 480px; margin: 0 auto; background: white; border-radius: 12px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .company-name { text-align: center; font-size: 13px; font-weight: 700; color: #475569; letter-spacing: 0.02em; margin-bottom: 16px; text-transform: uppercase; }
  .valid-badge { display: inline-flex; align-items: center; gap: 8px; background: #dcfce7; color: #166534; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
  h1 { font-size: 17px; margin: 0 0 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: #64748b; font-weight: 700; margin-bottom: 2px; }
  .field span { font-size: 15px; }
  a.download { display: inline-block; margin-top: 16px; color: #2563eb; font-weight: 600; text-decoration: none; font-size: 14px; }
  .error { color: #dc2626; text-align: center; padding: 40px 0; }
  .internal-nav { max-width: 480px; margin: 0 auto 12px; display: none; gap: 16px; font-size: 13px; }
  .internal-nav a { color: #475569; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<div class="internal-nav" id="internalNav">
  <a href="/dashboard.html">&larr; Kembali ke Dashboard</a>
  <a href="#" id="signAgainLink">+ Tambah TTD Lagi di Dokumen Ini</a>
</div>
<div class="card" id="card">Memuat...</div>
<script>
const parts = window.location.pathname.split('/');
const signatureId = parts[parts.length - 1];

async function checkInternalNav(documentId) {
  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (data.user) {
      document.getElementById('internalNav').style.display = 'flex';
      document.getElementById('signAgainLink').href = `/sign.html?id=${documentId}`;
    }
  } catch (e) { /* not logged in / public viewer - leave nav hidden */ }
}

async function load() {
  const res = await fetch(`/api/verify/${signatureId}`);
  const data = await res.json();
  const card = document.getElementById('card');
  if (!res.ok) {
    card.innerHTML = `<div class="error">${data.error}</div>`;
    return;
  }
  const s = data.signature;
  checkInternalNav(s.document_id);
  const signedDate = new Date(s.signed_at).toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
  const fileLinkHtml = s.drive_view_link
    ? `<a class="download" href="${s.drive_view_link}" target="_blank">Buka Dokumen di Google Drive &rarr;</a>`
    : (s.signed_filename ? `<a class="download" href="/signed/${s.signed_filename}" target="_blank">Lihat Dokumen &rarr;</a>` : '');
  const signerLine = s.signer_jabatan
    ? `${s.signer_name} &mdash; ${s.signer_jabatan}, ${s.signer_department || '-'}`
    : `${s.signer_name} (${s.signer_department || '-'})`;
  card.innerHTML = `
    <div class="company-name">PT. Rama Emerald Multi Sukses</div>
    <div class="valid-badge">✓ Tanda Tangan Valid</div>
    <h1>Detail Dokumen Tertandatangani</h1>
    <div class="field"><label>Nama Dokumen</label><span>${s.doc_name}</span></div>
    <div class="field"><label>Nomor Dokumen</label><span>${s.doc_number}</span></div>
    <div class="field"><label>Departemen</label><span>${s.department}</span></div>
    <div class="field"><label>Ditandatangani oleh</label><span>${signerLine}</span></div>
    <div class="field"><label>Waktu Tanda Tangan</label><span>${signedDate}</span></div>
    ${fileLinkHtml}
  `;
}
load();
</script>
</body>
</html>
