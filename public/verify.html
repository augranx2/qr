<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Verifikasi Tanda Tangan Elektronik</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body {
    min-height: 100vh; padding: 32px 20px; display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(circle at 50% 0%, #E9F3F0 0%, #F1F5F3 55%);
  }
  .internal-nav {
    max-width: 460px; width: 100%; margin: 0 auto 14px; display: none; gap: 10px; justify-content: center;
    animation: rise 0.3s var(--ease);
  }
  .internal-nav a {
    color: var(--brand-dark); text-decoration: none; font-weight: 600; font-size: 12.5px;
    background: var(--brand-soft); padding: 7px 14px; border-radius: 999px;
    transition: background 0.15s var(--ease);
  }
  .internal-nav a:hover { background: #D4EBE3; }

  .verify-card {
    max-width: 460px; width: 100%; margin: 0 auto; padding: 0; overflow: hidden;
  }
  .verify-topband {
    background: linear-gradient(135deg, #0F2620, #0B6E5C);
    padding: 28px 28px 20px; text-align: center;
  }
  .verify-logo-ring {
    width: 56px; height: 56px; margin: 0 auto 12px; background: white; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-md);
  }
  .verify-logo-ring img { width: 36px; height: 36px; object-fit: contain; }
  .company-name { color: white; font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.92; }

  .verify-body { padding: 26px 28px 30px; position: relative; z-index: 1; }
  .valid-badge {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--green-soft); color: var(--green); padding: 9px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 700; margin: -42px auto 22px; width: fit-content;
    box-shadow: var(--shadow-sm); border: 3px solid var(--paper);
    animation: pop 0.35s var(--ease) 0.1s backwards;
  }
  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  h1.verify-title { font-size: 16px; margin: 0 0 20px; text-align: center; color: var(--ink-soft); font-weight: 500; }
  .field { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .field:last-of-type { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .field label { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); font-weight: 700; margin-bottom: 3px; }
  .field span { font-size: 14.5px; color: var(--ink); }
  .field.mono span { font-family: var(--font-mono); }

  a.download {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 22px; color: white; background: var(--brand); font-weight: 600;
    text-decoration: none; font-size: 13.5px; padding: 12px; border-radius: var(--radius-sm);
    transition: background 0.15s var(--ease), transform 0.12s var(--ease);
  }
  a.download:hover { background: var(--brand-dark); }
  a.download:active { transform: translateY(1px); }

  .error { color: var(--red); text-align: center; padding: 50px 20px; font-size: 14px; }
</style>
</head>
<body>
<div class="internal-nav" id="internalNav">
  <a href="/dashboard.html">&larr; Kembali ke Dashboard</a>
  <a href="#" id="signAgainLink">+ Tambah TTD Lagi</a>
</div>
<div class="card verify-card" id="card">
  <div class="verify-topband">
    <div class="verify-logo-ring"><img src="/logo-rama.png" alt="Logo PT REMS"></div>
    <div class="company-name">PT. Rama Emerald Multi Sukses</div>
  </div>
  <div class="verify-body" id="cardBody">Memuat...</div>
</div>
<script>
const parts = window.location.pathname.split('/');
const signatureId = parts[parts.length - 1];

async function checkInternalNav(documentId) {
  try {
    const res = await fetch('/api/me');
    const data = await res.json();
    if (data.user) {
      document.getElementById('internalNav').style.display = 'flex';
      document.getElementById('signAgainLink').href = `/sign.html?id=${documentId}`;
    }
  } catch (e) { /* not logged in / public viewer - leave nav hidden */ }
}

async function load() {
  const res = await fetch(`/api/verify/${signatureId}`);
  const data = await res.json();
  const body = document.getElementById('cardBody');
  if (!res.ok) {
    body.innerHTML = `<div class="error">${data.error}</div>`;
    return;
  }
  const s = data.signature;
  checkInternalNav(s.document_id);
  const signedDate = new Date(s.signed_at).toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
  const fileLinkHtml = s.drive_view_link
    ? `<a class="download" href="${s.drive_view_link}" target="_blank">Buka Dokumen di Google Drive &rarr;</a>`
    : (s.signed_filename ? `<a class="download" href="/signed/${s.signed_filename}" target="_blank">Lihat Dokumen &rarr;</a>` : '');
  const signerLine = s.signer_jabatan
    ? `${s.signer_name} &mdash; ${s.signer_jabatan}, ${s.signer_department || '-'}`
    : `${s.signer_name} (${s.signer_department || '-'})`;
  body.innerHTML = `
    <div class="valid-badge">✓ Tanda Tangan Valid</div>
    <h1 class="verify-title">Detail Dokumen Tertandatangani</h1>
    <div class="field"><label>Nama Dokumen</label><span>${s.doc_name}</span></div>
    <div class="field mono"><label>Nomor Dokumen</label><span>${s.doc_number}</span></div>
    <div class="field"><label>Departemen</label><span>${s.department}</span></div>
    <div class="field"><label>Ditandatangani oleh</label><span>${signerLine}</span></div>
    <div class="field"><label>Waktu Tanda Tangan</label><span>${signedDate}</span></div>
    ${fileLinkHtml}
  `;
}
load();
</script>
</body>
</html>
