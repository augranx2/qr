<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Penempatan QR - TTD Elektronik</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  main { display: flex; gap: 24px; align-items: flex-start; }
  main > div:first-child { flex: 1; min-width: 0; }
  .doc-info { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; font-size: 13px; box-shadow: var(--shadow-sm); }
  .doc-info b { display: inline-block; width: 120px; color: var(--ink-soft); }
  .canvas-wrap { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: inline-block; box-shadow: var(--shadow-sm); }
  #pageCanvas, #imgPreview { display: block; max-width: 100%; }
  .qr-box {
    position: absolute; border: 2px dashed var(--brand); background: rgba(11, 110, 92, 0.12);
    cursor: move; display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--brand-dark); font-weight: 700; user-select: none;
    border-radius: 4px; transition: box-shadow 0.15s var(--ease);
  }
  .qr-box:hover { box-shadow: 0 0 0 4px rgba(11, 110, 92, 0.1); }
  .controls { width: 270px; flex-shrink: 0; }
  input[type=range] { width: 100%; accent-color: var(--brand); }
  .hint { font-size: 12px; color: var(--ink-soft); margin-top: 10px; line-height: 1.5; }
  .pager { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .pager button { padding: 5px 12px; border: 1px solid var(--border-strong); background: var(--card); border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; transition: border-color 0.15s var(--ease); }
  .pager button:hover { border-color: var(--brand); color: var(--brand-dark); }
  @media (max-width: 720px) { main { flex-direction: column; } .controls { width: 100%; } }
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="logo-chip"><img src="/logo-rama.png" alt="Logo PT REMS"></div>
    <h1>Penempatan Tanda Tangan QR</h1>
  </div>
  <a href="/dashboard.html">&larr; Kembali ke Dashboard</a>
</header>
<main>
  <div>
    <div class="doc-info" id="docInfo">Memuat dokumen...</div>
    <div class="pager" id="pager" style="display:none;">
      <button onclick="changePage(-1)">&lt; Sebelumnya</button>
      <span id="pageIndicator"></span>
      <button onclick="changePage(1)">Berikutnya &gt;</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="pageCanvas" style="display:none;"></canvas>
      <img id="imgPreview" style="display:none;">
      <div class="qr-box" id="qrBox">QR</div>
    </div>
  </div>
  <div class="controls">
    <div class="panel">
      <label>Ukuran QR Code</label>
      <input type="range" id="qrSize" min="5" max="30" value="12">
      <div class="hint">Geser kotak QR di atas dokumen ke posisi yang diinginkan, sesuaikan ukuran, lalu klik Tandatangani. Setelah tersimpan, Anda bisa langsung menempel QR lagi di posisi/halaman lain tanpa perlu kembali ke Dashboard dulu.</div>
      <div class="msg" id="signMsg" style="margin-top:10px;"></div>
      <button class="primary" id="signBtn" onclick="submitSignature()">Tandatangani Dokumen</button>
      <button class="secondary" id="doneBtn" onclick="window.location.href='/dashboard.html'" style="width:100%; margin-top:10px; padding:11px;">Selesai, Kembali ke Dashboard</button>
    </div>
  </div>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params = new URLSearchParams(window.location.search);
const docId = params.get('id');
let doc = null;
let pdfDocProxy = null;
let currentPage = 1;
let totalPages = 1;
let placedThisSession = 0;

// QR box state as fraction of rendered page (0-1)
let qrFrac = { x: 0.7, y: 0.05, size: 0.12 };
let dragging = false;

async function checkAuth() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (!data.user) window.location.href = '/';
}

async function loadDoc(isInitial) {
  const res = await fetch(`/api/documents/${docId}`);
  const data = await res.json();
  if (!res.ok) { document.getElementById('docInfo').textContent = data.error; return; }
  doc = data.document;
  const req = doc.required_departments || [];
  const signed = doc.signed_departments || [];
  const missing = req.filter(d => !signed.includes(d));
  let ttdInfo = '';
  if (doc.signature_count > 0) {
    const statusLabel = doc.completion_status === 'complete'
      ? `<span style="color:var(--green); font-weight:600;">Lengkap (${signed.length}/${req.length} departemen)</span>`
      : `<span style="color:var(--amber); font-weight:600;">Sebagian (${signed.length}/${req.length} departemen)</span>`;
    const missingLine = missing.length > 0 ? ` &mdash; menunggu: ${missing.join(', ')}` : '';
    ttdInfo = `<div><b>Status TTD:</b> ${statusLabel}${missingLine}</div>
               <div><b>TTD Sebelumnya:</b> ${doc.signature_count} tanda tangan &mdash; QR baru akan ditambahkan di atasnya</div>`;
  }
  document.getElementById('docInfo').innerHTML =
    `<div><b>Nama Dokumen:</b> ${doc.doc_name}</div>
     <div><b>No. Dokumen:</b> ${doc.doc_number}</div>
     <div><b>Departemen:</b> ${doc.department}</div>
     <div><b>Wajib TTD dari:</b> ${req.join(', ')}</div>
     ${ttdInfo}`;

  // cache-bust so the browser always fetches the latest version (with the QR we just added)
  const freshUrl = doc.current_file_url + (doc.current_file_url.includes('?') ? '&' : '?') + 't=' + Date.now();

  if (doc.file_type === 'pdf') {
    document.getElementById('pageCanvas').style.display = 'block';
    pdfDocProxy = await pdfjsLib.getDocument(freshUrl).promise;
    totalPages = pdfDocProxy.numPages;
    document.getElementById('pager').style.display = totalPages > 1 ? 'flex' : 'none';
    const pageToShow = Math.min(currentPage, totalPages);
    await renderPage(pageToShow);
  } else {
    const img = document.getElementById('imgPreview');
    img.src = freshUrl;
    img.style.display = 'block';
    img.onload = () => positionQrBox();
  }
  if (isInitial) setupDrag(); // only attach drag listeners once - not on every refresh
  updateQrBox();
}

async function renderPage(num) {
  currentPage = num;
  const page = await pdfDocProxy.getPage(num);
  const viewport = page.getViewport({ scale: 1.3 });
  const canvas = document.getElementById('pageCanvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  document.getElementById('pageIndicator').textContent = `Halaman ${currentPage} / ${totalPages}`;
  updateQrBox();
}

function changePage(delta) {
  const next = currentPage + delta;
  if (next < 1 || next > totalPages) return;
  renderPage(next);
}

function getSurfaceEl() {
  return doc.file_type === 'pdf' ? document.getElementById('pageCanvas') : document.getElementById('imgPreview');
}

function updateQrBox() {
  const surface = getSurfaceEl();
  const box = document.getElementById('qrBox');
  const w = surface.clientWidth || surface.width;
  const h = surface.clientHeight || surface.height;
  const size = qrFrac.size * w;
  box.style.width = size + 'px';
  box.style.height = size + 'px';
  box.style.left = (qrFrac.x * w) + 'px';
  box.style.top = (qrFrac.y * h) + 'px';
}

function positionQrBox() { updateQrBox(); }

function setupDrag() {
  const box = document.getElementById('qrBox');
  const wrap = document.getElementById('canvasWrap');
  let startX, startY, boxStartLeft, boxStartTop;

  box.addEventListener('mousedown', (e) => {
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    boxStartLeft = box.offsetLeft; boxStartTop = box.offsetTop;
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const surface = getSurfaceEl();
    const w = surface.clientWidth || surface.width;
    const h = surface.clientHeight || surface.height;
    let newLeft = boxStartLeft + (e.clientX - startX);
    let newTop = boxStartTop + (e.clientY - startY);
    newLeft = Math.max(0, Math.min(newLeft, w - box.offsetWidth));
    newTop = Math.max(0, Math.min(newTop, h - box.offsetHeight));
    box.style.left = newLeft + 'px';
    box.style.top = newTop + 'px';
    qrFrac.x = newLeft / w;
    qrFrac.y = newTop / h;
  });
  window.addEventListener('mouseup', () => dragging = false);

  document.getElementById('qrSize').addEventListener('input', (e) => {
    qrFrac.size = e.target.value / 100;
    updateQrBox();
  });
}

async function submitSignature() {
  const btn = document.getElementById('signBtn');
  const msgEl = document.getElementById('signMsg');
  btn.disabled = true;
  btn.textContent = 'Memproses...';
  try {
    const res = await fetch(`/api/documents/${docId}/sign`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        qr_x: qrFrac.x,
        qr_y: qrFrac.y,
        qr_size: qrFrac.size,
        page_number: currentPage
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    placedThisSession++;
    msgEl.textContent = `QR ke-${placedThisSession} berhasil ditempel di halaman ${currentPage}. Silakan tempel QR lagi kalau masih ada, atau klik Selesai.`;
    msgEl.className = 'msg success';
    msgEl.style.display = 'block';
    await loadDoc(false); // refresh preview to show the QR we just placed, without re-attaching drag listeners
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.className = 'msg error';
    msgEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Tandatangani Dokumen';
  }
}

checkAuth();
loadDoc(true);
</script>
</body>
</html>
