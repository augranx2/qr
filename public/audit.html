<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Audit Trail - TTD QR Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="logo-chip"><img src="/logo-rama.png" alt="Logo PT REMS"></div>
    <h1>Audit Trail — PT REMS</h1>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <a href="#" id="downloadBtn" onclick="downloadCsv(); return false;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
      Unduh CSV
    </a>
    <a href="/dashboard.html">&larr; Kembali ke Dashboard</a>
  </div>
</header>
<main>
  <div class="panel">
    <div class="panel-kop"><h2>Riwayat Aktivitas</h2><span class="kop-badge" id="logCount">0 aktivitas</span></div>
    <p class="sub">Login, logout, upload dokumen, dan tanda tangan — 500 aktivitas terakhir, terbaru di atas. Bisa diunduh sebagai CSV untuk kebutuhan audit.</p>
    <table>
      <thead><tr><th>Waktu</th><th>Aksi</th><th>Oleh</th><th>Detail</th></tr></thead>
      <tbody id="logList"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">Belum ada aktivitas tercatat.</div>
  </div>
</main>
<script>
// Sesi berakhir (idle 30 menit / batas absolut 12 jam): server membalas 401,
// dan halaman langsung diarahkan ke login daripada diam-diam gagal memuat data.
(function () {
  const origFetch = window.fetch;
  window.fetch = async function (...args) {
    const res = await origFetch.apply(this, args);
    if (res.status === 401 && !location.pathname.endsWith('/index.html') && location.pathname !== '/') {
      location.href = '/?expired=1';
    }
    return res;
  };
})();
const LABELS = {
  login: ['Login', 'login'],
  logout: ['Logout', 'logout'],
  upload_document: ['Upload Dokumen', 'upload_document'],
  sign_document: ['Tanda Tangan', 'sign_document'],
  change_password: ['Ganti Password', 'logout'],
  archive_document: ['Arsipkan Dokumen', 'sign_document'],
  unarchive_document: ['Kembalikan dari Arsip', 'upload_document'],
  delete_document: ['Hapus Dokumen', 'logout'],
  session_expired: ['Sesi Berakhir', 'logout']
};

function downloadCsv() {
  // Diarahkan langsung ke endpoint-nya; server yang menyusun CSV dan mengirim
  // header attachment, jadi browser otomatis mengunduh tanpa membuka tab baru.
  window.location.href = '/api/audit-log/export';
}

async function checkAuth() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (!data.user) { window.location.href = '/'; return; }
}

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Sebelumnya kolom Detail hanya diisi untuk upload dan tanda tangan, sehingga
// penghapusan dokumen - justru aktivitas yang paling perlu ditelusuri - tampil
// sebagai tanda strip tanpa keterangan apa pun.
function detailFor(entry) {
  const parts = [];
  if (entry.doc_number || entry.doc_name) {
    parts.push(`<span class="mono">${esc(entry.doc_number || '-')}</span> ${esc(entry.doc_name || '')}`);
  }
  if (entry.type === 'session_expired') {
    parts.push('<span class="detail-note">sesi berakhir otomatis (tidak ada aktivitas / browser ditutup tanpa logout)</span>');
  }
  if (entry.type === 'delete_document') {
    parts.push(entry.was_signed
      ? '<span class="detail-warn">dihapus permanen — dokumen ini sudah punya tanda tangan</span>'
      : '<span class="detail-note">dihapus permanen</span>');
  }
  return parts.length ? parts.join('<br>') : '<span class="detail-note">&mdash;</span>';
}

async function loadLog() {
  const res = await fetch('/api/audit-log');
  const data = await res.json();
  if (!res.ok) {
    document.querySelector('main').innerHTML = `<div class="panel"><p style="color:#dc2626;">${data.error}</p></div>`;
    return;
  }
  const tbody = document.getElementById('logList');
  tbody.innerHTML = '';
  document.getElementById('logCount').textContent = `${data.entries.length} aktivitas`;
  if (data.entries.length === 0) {
    document.getElementById('emptyMsg').style.display = 'block';
    return;
  }
  data.entries.forEach(entry => {
    const tr = document.createElement('tr');
    const label = LABELS[entry.type] ? LABELS[entry.type][0] : entry.type;
    const cssClass = LABELS[entry.type] ? LABELS[entry.type][1] : '';
    const when = new Date(entry.timestamp).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
    tr.innerHTML = `<td>${when}</td><td><span class="badge ${cssClass}">${label}</span></td><td>${entry.full_name || entry.username || '-'}</td><td class="detail-cell">${detailFor(entry)}</td>`;
    tbody.appendChild(tr);
  });
}

checkAuth();
loadLog();
</script>
</body>
</html>
