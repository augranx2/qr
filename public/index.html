<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login - TTD QR Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body {
    height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 15%, #16332B 0%, #0F2620 45%, #0B1D18 100%);
    background-attachment: fixed;
  }
  .login-card { padding: 44px 40px; width: 380px; }
  .login-logo {
    display: flex; align-items: center; justify-content: center;
    width: 68px; height: 68px; margin: 0 auto 20px;
    background: white; border-radius: 16px; box-shadow: var(--shadow-md);
  }
  .login-logo img { width: 44px; height: 44px; object-fit: contain; }
  h1.login-title { font-size: 21px; margin: 0 0 6px; text-align: center; }
  p.login-sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 28px; text-align: center; line-height: 1.6; }
  p.login-sub b { color: var(--ink); }
  #loginForm label { margin-top: 14px; }
  #loginForm label:first-of-type { margin-top: 0; }
  .error {
    display: none; background: var(--red-soft); color: var(--red); border: 1px solid #F0C9C5;
    padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; text-align: left;
  }
</style>
</head>
<body>
  <div class="card login-card">
    <div class="login-logo"><img src="/logo-rama.png" alt="Logo PT. Rama Emerald Multi Sukses"></div>
    <h1 class="login-title">Tanda Tangan Elektronik QR</h1>
    <p class="login-sub"><b>PT. Rama Emerald Multi Sukses</b><br>Login menggunakan username personil Anda</p>
    <div class="error" id="err"></div>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" required autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="primary" style="margin-top:20px;">Masuk</button>
    </form>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errBox = document.getElementById('err');
  errBox.style.display = 'none';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Login gagal');
    window.location.href = '/dashboard.html';
  } catch (err) {
    errBox.textContent = err.message;
    errBox.style.display = 'block';
  }
});
</script>
</body>
</html>
