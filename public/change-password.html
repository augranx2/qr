<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Ganti Password - TTD QR Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  main { max-width: 440px; }
</style>
</head>
<body>
<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="logo-chip"><img src="/logo-rama.png" alt="Logo PT REMS"></div>
    <h1>Ganti Password</h1>
  </div>
  <a href="/dashboard.html">&larr; Kembali ke Dashboard</a>
</header>
<main>
  <div class="panel">
    <h2>Ganti Password Akun Anda</h2>
    <p class="sub">Masukkan password lama untuk verifikasi, lalu password baru Anda.</p>
    <div class="msg" id="msg"></div>
    <form id="pwForm">
      <label>Password Lama</label>
      <input type="password" id="old_password" required autocomplete="current-password">
      <label style="margin-top:14px;">Password Baru</label>
      <input type="password" id="new_password" required minlength="4" autocomplete="new-password">
      <label style="margin-top:14px;">Ulangi Password Baru</label>
      <input type="password" id="confirm_password" required minlength="4" autocomplete="new-password">
      <button type="submit" class="primary" style="margin-top:18px;">Ganti Password</button>
    </form>
  </div>
</main>
<script>
async function checkAuth() {
  const res = await fetch('/api/me');
  const data = await res.json();
  if (!data.user) { window.location.href = '/'; return; }
}

document.getElementById('pwForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('msg');
  const oldPassword = document.getElementById('old_password').value;
  const newPassword = document.getElementById('new_password').value;
  const confirmPassword = document.getElementById('confirm_password').value;

  if (newPassword !== confirmPassword) {
    msgEl.textContent = 'Password baru dan ulangi password tidak sama.';
    msgEl.className = 'msg error';
    msgEl.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/me/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ oldPassword, newPassword })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    msgEl.textContent = 'Password berhasil diganti.';
    msgEl.className = 'msg success';
    msgEl.style.display = 'block';
    document.getElementById('pwForm').reset();
  } catch (err) {
    msgEl.textContent = err.message;
    msgEl.className = 'msg error';
    msgEl.style.display = 'block';
  }
});

checkAuth();
</script>
</body>
</html>
